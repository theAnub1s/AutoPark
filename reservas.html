<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mis reservas - AutoPark</title>

    <link rel="stylesheet" href="assets/vendor/bootstrap/bootstrap.min.css">

    <script src="assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>

    <link
        rel="stylesheet"
        href="components/navbar/navbar.css"
    >

    <link
        rel="stylesheet"
        href="css/reservas.css"
    >

</head>


<body>

    <div id="navbar"></div>


    <main class="reservas-page">

        <header class="reservas-header">

            <h1>
                Mis reservas
            </h1>

            <p>
                Consulta tus reservas activas y tu historial.
            </p>

        </header>


        <ul
            class="nav nav-tabs tabs"
            role="tablist"
            aria-label="Filtros de reservas"
        >
            <li class="nav-item" role="presentation">
                <button
                    type="button"
                    class="nav-link tab-button active"
                    data-tab="activas"
                    role="tab"
                    aria-selected="true"
                >
                    Activas
                </button>
            </li>

            <li class="nav-item" role="presentation">
                <button
                    type="button"
                    class="nav-link tab-button"
                    data-tab="historial"
                    role="tab"
                    aria-selected="false"
                >
                    Historial
                </button>
            </li>
        </ul>


        <section
            id="reservasContainer"
            class="reservas-container"
        ></section>


        <div
            id="emptyState"
            class="empty-state hidden"
        >

            <h2>
                No hay reservas
            </h2>

            <p>
                Aquí aparecerán tus reservas cuando realices una.
            </p>

        </div>

    </main>



    <script>

        fetch("components/navbar/navbar.html")

            .then(response => response.text())

            .then(data => {

                document.getElementById("navbar").innerHTML = data;

                const script =
                    document.createElement("script");

                script.src =
                    "components/navbar/navbar.js";

                document.body.appendChild(script);

            })

            .catch(error => {

                console.error(
                    "Error al cargar el navbar:",
                    error
                );

            });

    </script>


    <script src="js/reservas.js"></script>

</body>

</html>
