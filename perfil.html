<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Perfil - AutoPark</title>

    <link
        rel="stylesheet"
        href="components/navbar/navbar.css"
    >

    <link
        rel="stylesheet"
        href="css/perfil.css"
    >

</head>


<body data-navbar-mode="user">

    <!-- NAVBAR REUTILIZABLE -->
    <div id="navbar"></div>


    <main class="perfil-page">


        <!-- ENCABEZADO -->

        <header class="perfil-header">

            <h1>Perfil</h1>

            <p class="perfil-subtitle">
                Consulta y edita la información asociada a tu cuenta.
            </p>

        </header>


        <!-- DISTRIBUCIÓN PRINCIPAL -->

        <div class="perfil-layout">


            <!-- PANEL IZQUIERDO (TARJETA LATERAL) -->

            <aside class="card-sidebar">

                <div
                    class="avatar"
                    id="avatarInitials"
                >FR</div>

                <h2
                    class="user-name"
                    id="userNameTitle"
                >Fernando Ruiz</h2>

                <p class="user-status">
                    Conductor · Cuenta activa
                </p>


                <div class="divider"></div>


                <div class="stats-list">

                    <div class="stat-item">
                        <span>Reservas realizadas</span>
                        <span class="stat-number">12</span>
                    </div>

                    <div class="stat-item">
                        <span>Espacios publicados</span>
                        <span class="stat-number">3</span>
                    </div>

                </div>


                <button
                    type="button"
                    class="btn btn-outline btn-full"
                    id="btnLogout"
                >
                    Cerrar sesión
                </button>

            </aside>


            <!-- PANEL DERECHO (FORMULARIO DE PERFIL) -->

            <section class="card-form">

                <h2>Información personal</h2>


                <form id="profileForm">


                    <div class="form-grid">


                        <!-- NOMBRE -->

                        <div class="form-group">

                            <label for="nombre">
                                Nombre completo
                            </label>

                            <input
                                type="text"
                                id="nombre"
                                name="nombre"
                                value="Fernando Ruiz"
                                disabled
                                required
                            >

                        </div>


                        <!-- CORREO -->

                        <div class="form-group">

                            <label for="correo">
                                Correo electrónico
                            </label>

                            <input
                                type="email"
                                id="correo"
                                name="correo"
                                value="correo@ejemplo.com"
                                disabled
                                required
                            >

                        </div>


                        <!-- TELÉFONO -->

                        <div class="form-group">

                            <label for="telefono">
                                Teléfono
                            </label>

                            <input
                                type="tel"
                                id="telefono"
                                name="telefono"
                                value="771 000 0000"
                                disabled
                            >

                        </div>


                        <!-- TIPO DE CUENTA -->

                        <div class="form-group">

                            <label for="tipoCuenta">
                                Tipo de cuenta
                            </label>

                            <input
                                type="text"
                                id="tipoCuenta"
                                name="tipoCuenta"
                                value="Conductor"
                                disabled
                            >

                        </div>


                        <!-- CIUDAD -->

                        <div class="form-group">

                            <label for="ciudad">
                                Ciudad
                            </label>

                            <input
                                type="text"
                                id="ciudad"
                                name="ciudad"
                                value="Pachuca de Soto"
                                disabled
                            >

                        </div>


                        <!-- CONTRASEÑA -->

                        <div class="form-group">

                            <label for="contrasena">
                                Contraseña
                            </label>

                            <input
                                type="password"
                                id="contrasena"
                                name="contrasena"
                                value="••••••••"
                                disabled
                            >

                        </div>


                    </div>


                    <!-- BOTONES DE ACCIÓN -->

                    <div class="form-actions">

                        <button
                            type="button"
                            class="btn btn-dark"
                            id="btnEditar"
                        >
                            Editar perfil
                        </button>

                        <button
                            type="submit"
                            class="btn btn-cyan"
                            id="btnGuardar"
                            disabled
                        >
                            Guardar cambios
                        </button>

                        <button
                            type="button"
                            class="btn btn-outline"
                            id="btnCancelar"
                            disabled
                        >
                            Cancelar
                        </button>

                    </div>


                    <p class="form-hint">
                        Los campos se habilitan al seleccionar "Editar perfil".
                    </p>


                </form>

            </section>


        </div>


    </main>


    <!-- CARGAR NAVBAR REUTILIZABLE -->

    <script>

        fetch("components/navbar/navbar.html")

            .then(response => response.text())

            .then(data => {

                document.getElementById("navbar").innerHTML = data;

                const script =
                    document.createElement("script");

                script.src =
                    "components/navbar/navbar.js";

                document.body.appendChild(script);

            })

            .catch(error => {

                console.error(
                    "Error al cargar el navbar:",
                    error
                );

            });

    </script>


    <script src="js/perfil.js"></script>

</body>

</html>
