<!DOCTYPE html>
<html lang="es" data-bs-theme="light">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Perfil - AutoPark</title>

    <link rel="stylesheet" href="assets/vendor/bootstrap/bootstrap.min.css">

    <script src="assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>

    <link
        rel="stylesheet"
        href="components/navbar/navbar.css"
    >

    <link
        rel="stylesheet"
        href="css/perfil.css"
    >

</head>


<body data-navbar-mode="user">

    <!-- NAVBAR REUTILIZABLE -->
    <div id="navbar"></div>


    <main class="perfil-page">


        <!-- ENCABEZADO -->

        <header class="perfil-header">

            <h1>Perfil</h1>

            <p class="perfil-subtitle">
                Consulta y edita la información asociada a tu cuenta.
            </p>

        </header>


        <!-- DISTRIBUCIÓN PRINCIPAL -->

        <div class="perfil-layout">


            <!-- PANEL IZQUIERDO (TARJETA LATERAL) -->

            <aside class="card-sidebar">

                <div
                    class="avatar"
                    id="avatarInitials"
                >FR</div>

                <h2
                    class="user-name"
                    id="userNameTitle"
                >Fernando Ruiz</h2>

                <p class="user-status">
                    Conductor · Cuenta activa
                </p>


                <div class="divider"></div>


                <div class="stats-list">

                    <div class="stat-item">
                        <span>Reservas realizadas</span>
                        <span class="stat-number">12</span>
                    </div>

                    <div class="stat-item">
                        <span>Espacios publicados</span>
                        <span class="stat-number">3</span>
                    </div>

                </div>


                <button
                    type="button"
                    class="btn btn-outline btn-full"
                    id="btnLogout"
                >
                    Cerrar sesión
                </button>

            </aside>


            <!-- PANEL DERECHO (FORMULARIO DE PERFIL) -->

            <section class="card-form">

                <!-- ENCABEZADO CON SWITCH DE BOOTSTRAP -->
                <div class="card-form-header">
                    <h2>Información personal</h2>

                    <div class="theme-switcher d-flex align-items-center gap-2">
                        <span class="theme-label">Tonalidad :</span>
                        
                        <!-- Componente Switch de Bootstrap -->
                        <div class="form-check form-switch m-0 d-flex align-items-center gap-2">
                            <!-- Ícono Sol -->
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="5"></circle>
                                <line x1="12" y1="1" x2="12" y2="3"></line>
                                <line x1="12" y1="21" x2="12" y2="23"></line>
                                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                                <line x1="1" y1="12" x2="3" y2="12"></line>
                                <line x1="21" y1="12" x2="23" y2="12"></line>
                                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                            </svg>

                            <input class="form-check-input my-0" type="checkbox" role="switch" id="btnThemeToggle" aria-label="Cambiar tema">

                            <!-- Ícono Luna -->
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                            </svg>
                        </div>
                    </div>
                </div>


                <form id="profileForm">


                    <div class="form-grid">


                        <!-- NOMBRE -->

                        <div class="form-group">

                            <label for="nombre">
                                Nombre completo
                            </label>

                            <input class="form-control"
                                type="text"
                                id="nombre"
                                name="nombre"
                                value="Fernando Ruiz"
                                disabled
                                required
                            >

                        </div>


                        <!-- CORREO -->

                        <div class="form-group">

                            <label for="correo">
                                Correo electrónico
                            </label>

                            <input class="form-control"
                                type="email"
                                id="correo"
                                name="correo"
                                value="correo@ejemplo.com"
                                disabled
                                required
                            >

                        </div>


                        <!-- TELÉFONO -->

                        <div class="form-group">

                            <label for="telefono">
                                Teléfono
                            </label>

                            <input class="form-control"
                                type="tel"
                                id="telefono"
                                name="telefono"
                                value="771 000 0000"
                                disabled
                            >

                        </div>


                        <!-- TIPO DE CUENTA -->

                        <div class="form-group">

                            <label for="tipoCuenta">
                                Tipo de cuenta
                            </label>

                            <input class="form-control"
                                type="text"
                                id="tipoCuenta"
                                name="tipoCuenta"
                                value="Conductor"
                                disabled
                            >

                        </div>


                        <!-- CIUDAD -->

                        <div class="form-group">

                            <label for="ciudad">
                                Ciudad
                            </label>

                            <input class="form-control"
                                type="text"
                                id="ciudad"
                                name="ciudad"
                                value="Pachuca de Soto"
                                disabled
                            >

                        </div>


                        <!-- CONTRASEÑA -->

                        <div class="form-group">

                            <label for="contrasena">
                                Contraseña
                            </label>

                            <input class="form-control"
                                type="password"
                                id="contrasena"
                                name="contrasena"
                                value="••••••••"
                                disabled
                            >

                        </div>


                    </div>


                    <!-- BOTONES DE ACCIÓN (CONTENEDOR PARA DELEGACIÓN DE EVENTOS) -->

                    <div class="form-actions" id="contenedorAcciones">

                        <button
                            type="button"
                            class="btn btn-dark"
                            id="btnEditar"
                        >
                            Editar perfil
                        </button>

                        <button
                            type="submit"
                            class="btn btn-cyan"
                            id="btnGuardar"
                            disabled
                        >
                            Guardar cambios
                        </button>

                        <button
                            type="button"
                            class="btn btn-outline"
                            id="btnCancelar"
                            disabled
                        >
                            Cancelar
                        </button>

                    </div>


                    <p class="form-hint">
                        Los campos se habilitan al seleccionar "Editar perfil".
                    </p>


                </form>

            </section>


        </div>


    </main>


    <!-- CARGAR NAVBAR REUTILIZABLE -->

    <script>

        fetch("components/navbar/navbar.html")

            .then(response => response.text())

            .then(data => {

                document.getElementById("navbar").innerHTML = data;

                const script =
                    document.createElement("script");

                script.src =
                    "components/navbar/navbar.js";

                document.body.appendChild(script);

            })

            .catch(error => {

                console.error(
                    "Error al cargar el navbar:",
                    error
                );

            });

    </script>


    <script src="js/perfil.js"></script>

</body>

</html>
