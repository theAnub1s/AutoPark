<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Iniciar sesión - AutoPark</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"
    ></script>

    <link
        rel="stylesheet"
        href="components/navbar/navbar.css"
    >

    <link
        rel="stylesheet"
        href="css/login.css"
    >

</head>


<body data-navbar-mode="guest">

    <!-- NAVBAR REUTILIZABLE -->
    <div id="navbar"></div>


    <main class="login-page">


        <!-- PANEL IZQUIERDO -->

        <section class="login-welcome">

            <div class="welcome-content">

                <h1>
                    Bienvenido<br>
                    de nuevo
                </h1>

                <p class="welcome-text">
                    Continúa administrando tus reservas
                    y espacios desde AutoPark.
                </p>


                <div class="welcome-card">

                    <p>• Consulta disponibilidad</p>

                    <p>• Revisa tus reservas</p>

                    <p>• Gestiona tus espacios</p>

                </div>

            </div>

        </section>



        <!-- PANEL DERECHO -->

        <section class="login-area">

            <div class="login-card">

                <h2>Iniciar sesión</h2>


                <form id="loginForm">


                    <!-- CORREO -->

                    <div class="form-group">

                        <label for="email">
                            Correo electrónico
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="correo@ejemplo.com"
                            required
                        >

                    </div>


                    <!-- CONTRASEÑA -->

                    <div class="form-group">

                        <label for="password">
                            Contraseña
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="••••••••"
                            required
                        >

                    </div>


                    <!-- OPCIONES -->

                    <div class="login-options">

                        <label class="remember-option">

                            <input
                                type="checkbox"
                                id="remember"
                                name="remember"
                            >

                            <span>
                                Mantener sesión iniciada
                            </span>

                        </label>


                        <a
                            href="#"
                            class="forgot-password"
                        >
                            ¿Olvidaste tu contraseña?
                        </a>

                    </div>


                    <!-- MENSAJE -->

                    <p
                        id="loginMessage"
                        class="login-message"
                    ></p>


                    <!-- ENTRAR -->

                    <button
                        type="submit"
                        class="btn-login"
                    >
                        Entrar
                    </button>


                    <div class="login-divider"></div>


                    <p class="register-text">
                        ¿Aún no tienes cuenta?
                    </p>


                    <a
                        href="registro.html"
                        class="btn-register"
                    >
                        Crear cuenta
                    </a>


                </form>

            </div>

        </section>

    </main>



    <!-- CARGAR NAVBAR -->

    <script>

        fetch("components/navbar/navbar.html")

            .then(response => response.text())

            .then(data => {

                document.getElementById("navbar").innerHTML = data;

                const script =
                    document.createElement("script");

                script.src =
                    "components/navbar/navbar.js";

                document.body.appendChild(script);

            })

            .catch(error => {

                console.error(
                    "Error al cargar el navbar:",
                    error
                );

            });

    </script>


    <script src="js/login.js"></script>

</body>

</html>
